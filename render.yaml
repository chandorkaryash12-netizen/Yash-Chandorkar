# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Everything is filled in automatically;
# the admin password is generated by Render (see the Environment tab).
services:
  - type: web
    name: vector-equity-research
    runtime: node
    plan: starter            # persistent disks need a paid instance
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: chandorkaryash12@gmail.com
      # Render creates a strong random password on first deploy. Find it under
      # the service's Environment tab, log in, then change it in Admin > My account.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Yash Chandorkar
    disk:
      name: vector-data
      mountPath: /var/data
      sizeGB: 1
